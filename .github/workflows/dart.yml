name: Dart

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:  
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shared
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed . --exclude="**/*.g.dart"
      - run: dart analyze
      - run: dart test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed . --exclude="**/*.g.dart"
      - run: dart analyze
      - run: dart test

  template_server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./template_server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed . --exclude="**/*.g.dart"
      - run: dart analyze
      - run: dart test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed . --exclude="**/*.g.dart"
      - run: flutter analyze
      - run: flutter test
